name: Official calendar
on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 10 * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-calendar.js
